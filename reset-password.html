<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<title>Установка пароля — Oaks Finance</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f4ef;color:#111;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 50px}
.brand{font-weight:900;font-size:18px;color:#666;margin:5px 0 18px;text-align:right}
.card{
 background:#fff;border:1px solid #ddd9ca;border-radius:24px;padding:20px;
 box-shadow:0 10px 30px rgba(0,0,0,.06)
}
h1{font-size:28px;line-height:1.05;margin:0 0 10px}
p{color:#666;line-height:1.45}
.notice{padding:12px 14px;border-radius:16px;background:#fff4a8;border:1px solid #ead05d;margin:14px 0}
label{display:block;font-weight:800;margin-top:12px;color:#555}
input{
 width:100%;margin-top:6px;min-height:50px;border:1px solid #d7d4cc;border-radius:14px;
 padding:10px 12px;font-size:16px;background:#fff;color:#111
}
button{
 width:100%;min-height:52px;margin-top:14px;border:0;border-radius:16px;
 padding:11px 14px;background:#111;color:#ffd400;font-weight:900;font-size:17px
}
button:disabled{opacity:.45}
.status{margin-top:14px;padding:12px 14px;border-radius:14px;background:#f3f2ee;line-height:1.4}
.status.ok{background:#e9f8ef;color:#08733f}
.status.bad{background:#fff0ef;color:#a5241c}
.small{font-size:12px;color:#777;margin-top:10px}
a{color:#111;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
 <div class="brand">Oaks Finance</div>
 <div class="card">
  <h1>Установка пароля</h1>
  <p>Эта страница используется только после перехода по письму Supabase.</p>
  <div class="notice">Не закрывай эту страницу, пока не появится сообщение <b>«Пароль установлен»</b>.</div>

  <label>Новый пароль
   <input id="pw1" type="password" minlength="8" autocomplete="new-password" placeholder="Минимум 8 символов">
  </label>
  <label>Повтори пароль
   <input id="pw2" type="password" minlength="8" autocomplete="new-password" placeholder="Повтори пароль">
  </label>

  <button id="saveBtn" type="button" disabled>Сохранить пароль</button>
  <div id="status" class="status">Проверяю ссылку Supabase…</div>
  <div class="small" id="details"></div>
  <div class="small" style="margin-top:18px"><a href="https://oaksfamily.github.io/Oaks-finance/">Вернуться в Oaks Finance</a></div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const URL="https://ozwlnisasawasraqqaot.supabase.co";
 const KEY="sb_publishable_aJYPCH2NISEtca_sj-h8bQ_o5xtcFZv";
 const status=document.getElementById('status');
 const details=document.getElementById('details');
 const saveBtn=document.getElementById('saveBtn');
 const pw1=document.getElementById('pw1');
 const pw2=document.getElementById('pw2');
 let client=null;
 let sessionReady=false;

 function setStatus(msg,type){
  status.textContent=msg;
  status.className='status'+(type?' '+type:'');
 }
 function cleanUrl(){
  try{history.replaceState(null,'',location.pathname);}catch(e){}
 }
 async function checkSession(){
  if(!window.supabase||!window.supabase.createClient){
   setStatus('Не загрузился модуль Supabase. Проверь интернет и перезагрузи страницу.','bad');
   return;
  }
  client=window.supabase.createClient(URL,KEY,{
   auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });

  client.auth.onAuthStateChange(function(event,session){
   if(event==='PASSWORD_RECOVERY' && session){
    sessionReady=true;
    saveBtn.disabled=false;
    setStatus('Ссылка подтверждена. Теперь задай новый пароль.','ok');
   }
  });

  try{
   const res=await client.auth.getSession();
   if(res.error)throw res.error;
   const session=res.data&&res.data.session;
   if(session){
    sessionReady=true;
    saveBtn.disabled=false;
    setStatus('Сессия подтверждена. Введи новый пароль.','ok');
   } else {
    const hp=new URLSearchParams((location.hash||'').replace(/^#/,''));
    if(hp.get('error_description')){
     setStatus('Supabase: '+decodeURIComponent(hp.get('error_description')),'bad');
    } else {
     setStatus('Сессия восстановления не найдена. Открой страницу именно по свежей ссылке из письма Supabase.','bad');
    }
   }
  }catch(e){
   setStatus('Ошибка Supabase: '+(e&&e.message?e.message:e),'bad');
  }
 }

 saveBtn.addEventListener('click',async function(){
  const a=pw1.value||'',b=pw2.value||'';
  if(!sessionReady){setStatus('Сначала нужно открыть свежую ссылку из письма Supabase.','bad');return;}
  if(a.length<8){setStatus('Пароль должен содержать минимум 8 символов.','bad');return;}
  if(a!==b){setStatus('Пароли не совпадают.','bad');return;}
  saveBtn.disabled=true;
  setStatus('Сохраняю пароль…');
  try{
   const res=await client.auth.updateUser({password:a});
   if(res.error)throw res.error;
   setStatus('Пароль установлен. Теперь открой Oaks Finance с экрана Домой и войди по e-mail и этому паролю.','ok');
   details.textContent='Готово. Эту страницу можно закрыть.';
   pw1.value='';pw2.value='';
   cleanUrl();
  }catch(e){
   saveBtn.disabled=false;
   setStatus('Не удалось установить пароль: '+(e&&e.message?e.message:e),'bad');
  }
 });

 checkSession();
})();
</script>
</body>
</html>
